name: Build Consoles

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.7

jobs:
  build-console:
    name: Build
    runs-on: ${{ inputs.os }}
    container:
      image: ${{ inputs.name == 'Nintendo 3DS' && 'devkitpro/devkitarm:latest' || 'devkitpro/devkitppc:latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install System Dependencies (Wii U)
        if: inputs.name == 'Wii U'
        run: |
          apt-get update && apt-get install -y build-essential git wget curl zip

      - name: Install Console Toolchains & Dependencies
        run: |
          if [ "${{ inputs.name }}" = "Nintendo 3DS" ]; then
            dkp-pacman -S --noconfirm --needed 3ds-dev citro3d citro2d 3ds-portlibs general-tools
            git clone https://github.com/PabloMK7/libcwav.git --recursive
            cd libcwav
            make install
            cp lib/libcwav.a /opt/devkitpro/portlibs/3ds/lib/libcwav.a
            cp include/cwav.h /opt/devkitpro/portlibs/3ds/include/
            if [ -d "libncsnd" ]; then
                cp libncsnd/lib/libncsnd.a /opt/devkitpro/portlibs/3ds/lib/libncsnd.a
                cp libncsnd/include/ncsnd.h /opt/devkitpro/portlibs/3ds/include/
            fi
            cd .. && rm -rf libcwav
            wget -q https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip -O bannertool.zip
            unzip -q bannertool.zip -d bannertool_extracted
            find bannertool_extracted -type f -name "bannertool" -exec cp {} /opt/devkitpro/tools/bin/ \;
            chmod +x /opt/devkitpro/tools/bin/bannertool
            wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.16/makerom-linux_x86_64-v0.16.zip -O makerom.zip
            unzip -q makerom.zip -d makerom_extracted
            find makerom_extracted -type f -name "makerom" -exec cp {} /opt/devkitpro/tools/bin/ \;
            chmod +x /opt/devkitpro/tools/bin/makerom
            rm -rf bannertool.zip bannertool_extracted makerom.zip makerom_extracted
          elif [ "${{ inputs.name }}" = "Wii U" ]; then
            dkp-pacman -S --noconfirm --needed devkitppc-gcc wut wut-tools general-tools catnip wiiu-dev
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-17-jre-headless imagemagick
            sudo mkdir -p /opt/devkitpro/tools/bin
            sudo wget -q https://raw.githubusercontent.com/ihaveamac/nuspacker/master/NUSPacker.jar -O /opt/devkitpro/tools/bin/NUSPacker.jar
            dkp-pacman -S --noconfirm --needed wiiu-sdl2 wiiu-sdl2_image wiiu-sdl2_ttf wiiu-sdl2_mixer
            echo "=== Verifying SDL2 Installation ==="
            ls -la /opt/devkitpro/portlibs/wiiu/include/SDL2/ || echo "ERROR: SDL2 directory not found!"
            echo "=== Verifying NUSPacker Installation ==="
            ls -la /opt/devkitpro/tools/bin/NUSPacker.jar || echo "ERROR: NUSPacker.jar not found!"
          fi

      - name: Setup HXCPP 3DS
        if: inputs.name == 'Nintendo 3DS'
        run: |
          mkdir -p .haxelib
          haxelib setup .haxelib
          haxelib git hxcpp https://github.com/PsychEngine-report/hxcpp --quiet
          cd .haxelib/hxcpp/git/tools/run
          haxe compile.hxml
          cd ../hxcpp
          haxe compile.hxml
          cd $GITHUB_WORKSPACE

      - name: Setup HXCPP Wii U
        if: inputs.name == 'Wii U'
        run: |
          mkdir -p .haxelib
          haxelib setup .haxelib
          haxelib git hxcpp https://github.com/Ethantobot11/hxcpp-wiiu --quiet
          cd .haxelib/hxcpp/git/tools/run
          haxe compile.hxml
          cd ../hxcpp
          haxe compile.hxml
          cd $GITHUB_WORKSPACE

      - name: Setup Virtual Environment and Install Pillow (3DS)
        if: inputs.name == 'Nintendo 3DS'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip install Pillow --break-system-packages
          sudo apt-get update && sudo apt-get install -y ffmpeg
          export PATH=/opt/devkitpro/tools/bin:$PATH

      - name: Convert Images, XMLs & Audio Files (3DS)
        if: inputs.name == 'Nintendo 3DS'
        run: |
          python3 convert_assets.py

      - name: Install 3DS Specific Haxelibs (3DS)
        if: inputs.name == 'Nintendo 3DS'
        run: |
          haxelib git libcwav https://github.com/PabloMK7/libcwav.git --quiet
          haxelib git libncsnd https://github.com/PabloMK7/libncsnd.git --quiet
          haxelib git haxe3ds https://github.com/Ethantobot11/Haxe3DS.git --quiet

      - name: Install Wii U Specific Haxelibs (Wii U)
        if: inputs.name == 'Wii U'
        run: |
          rm -rf .haxelib/haxe3ds
          rm -rf .haxelib/hxu_sdl2
          rm -rf .haxelib/hxu_jansson
          rm -rf .haxelib/hxu_vorbis
          
          haxelib git haxe3ds https://github.com/Ethantobot11/Haxe3DS.git beta --quiet
          haxelib git hxu_sdl2 https://github.com/Ethantobot11/HxU_SDL2 hxcpp_test --quiet
          haxelib git hxu_jansson https://github.com/Ethantobot11/HxU_Jansson --quiet
          haxelib git hxu_vorbis https://github.com/Ethantobot11/HxU_Vorbis hxcpp_test --quiet

      - name: Compile Application (Unified via haxe3ds tool)
        env:
          WIIU_COMMON_KEY: ${{ secrets.WIIU_COMMON_KEY }}
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH=${DEVKITPRO}/tools/bin:$PATH

          rm -rf export/obj
          
          if [ "${{ inputs.name }}" = "Nintendo 3DS" ]; then
            export DEVKITARM=${DEVKITPRO}/devkitARM
            export PATH=${DEVKITARM}/bin:$PATH
            export CXX=arm-none-eabi-g++
            export CC=arm-none-eabi-gcc
            export AR=arm-none-eabi-ar
            export RANLIB=arm-none-eabi-ranlib
            haxelib run haxe3ds -c -Dnx -Dno_pch
          else
            export DEVKITPPC=${DEVKITPRO}/devkitPPC
            export PATH=${DEVKITPPC}/bin:$PATH
            export CXX=powerpc-eabi-g++
            export CC=powerpc-eabi-gcc
            export AR=powerpc-eabi-ar
            export RANLIB=powerpc-eabi-ranlib
            
            haxelib run haxe3ds -c -Dwiiu -Dno_pch -Dwiiu -Dwup
          fi

      - name: Verify Build Output
        if: always()
        run: |
          echo "=== Checking build output ==="
          ls -lh export/output/ || echo "No output directory"
          ls -lh buildFiles/ || echo "No buildFiles directory"

      - name: Archive and Upload Workspace for Inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-debug-${{ inputs.name == 'Nintendo 3DS' && '3ds' || 'wiiu' }}
          path: |
            export/
            buildFiles/
          if-no-files-found: ignore

      - name: Zip Wii U Build (if applicable)
        if: inputs.name == 'Wii U'
        run: |
          echo "Zipping installable_build directory..."
          cd installable_build
          zip -r ../WiiU_WUP_Build.zip .
          cd ..
          echo "Zip created successfully!"

      - name: Upload Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.name == 'Wii U' && 'WiiU_WUP_Build.zip' || inputs.artifactPath }}
          if-no-files-found: warn
